<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Dodger - HTML5 Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            font-size: 2rem;
            text-shadow: 0 0 10px #00d2ff;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background-color: #050510;
            display: block;
        }

        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 16, 0.85);
            transition: opacity 0.3s ease;
        }

        .btn {
            background: linear-gradient(45deg, #00d2ff, #0066ff);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        #instructions {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>ORBIT DODGER</h1>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="uiOverlay">
            <h2 id="menuTitle" style="font-size: 2.5rem; margin-bottom: 10px;">Avoid the Asteroids!</h2>
            <p id="menuSubtitle" style="color: #00d2ff; font-size: 1.2rem; margin: 0;">Collect stars to score points.</p>
            <button id="startBtn" class="btn">START GAME</button>
            <div id="instructions">
                Controls: Use <b>Arrow Keys</b> or <b>WASD</b> to move.<br>
                Don't let the red hazards hit you!
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiOverlay = document.getElementById('uiOverlay');
        const startBtn = document.getElementById('startBtn');
        const menuTitle = document.getElementById('menuTitle');
        const menuSubtitle = document.getElementById('menuSubtitle');

        // Game State
        let gameActive = false;
        let score = 0;
        let keys = {};

        // Player configuration
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 15,
            speed: 5,
            color: '#00d2ff'
        };

        // Entities arrays
        let hazards = [];
        let stars = [];
        let particles = [];

        // Input Listeners
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        startBtn.addEventListener('click', initGame);

        function initGame() {
            // Reset state
            score = 0;
            hazards = [];
            stars = [];
            particles = [];
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            
            // Spawn initial star
            spawnStar();

            // Hide UI overlay
            uiOverlay.classList.add('hidden');
            gameActive = true;
            
            // Start loop
            requestAnimationFrame(gameLoop);
        }

        function spawnStar() {
            stars.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                radius: 8,
                color: '#ffe600'
            });
        }

        function spawnHazard() {
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -20 : canvas.width + 20;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -20 : canvas.height + 20;
            }

            const angle = Math.atan2(player.y - y, player.x - x) + (Math.random() - 0.5) * 0.5;
            const speed = Math.random() * 2 + 2 + (score * 0.1);

            hazards.push({
                x: x,
                y: y,
                radius: Math.random() * 12 + 10,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: '#ff3366'
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function update() {
            if (keys['arrowup'] || keys['w']) player.y -= player.speed;
            if (keys['arrowdown'] || keys['s']) player.y += player.speed;
            if (keys['arrowleft'] || keys['a']) player.x -= player.speed;
            if (keys['arrowright'] || keys['d']) player.x += player.speed;

            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;

            if (Math.random() < 0.03 + (score * 0.002) && hazards.length < 25) {
                spawnHazard();
            }

            for (let i = hazards.length - 1; i >= 0; i--) {
                const h = hazards[i];
                h.x += h.vx;
                h.y += h.vy;

                if (h.x < -50 || h.x > canvas.width + 50 || h.y < -50 || h.y > canvas.height + 50) {
                    hazards.splice(i, 1);
                    continue;
                }

                const dist = Math.hypot(player.x - h.x, player.y - h.y);
                if (dist < player.radius + h.radius) {
                    gameOver();
                }
            }

            for (let i = stars.length - 1; i >= 0; i--) {
                const s = stars[i];
                const dist = Math.hypot(player.x - s.x, player.y - s.y);
                
                if (dist < player.radius + s.radius) {
                    createExplosion(s.x, s.y, s.color);
                    score++;
                    stars.splice(i, 1);
                    spawnStar();
                    
                    if(score % 2 === 0) spawnHazard(); 
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = s.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            hazards.forEach(h => {
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
                ctx.fillStyle = h.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = h.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Arial';
            ctx.fillText(`SCORE: ${score}`, 20, 40);
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameActive = false;
            createExplosion(player.x, player.y, player.color);
            
            menuTitle.innerText = "GAME OVER";
            menuSubtitle.innerHTML = `Final Score: <b style="color:#ffe600; font-size:1.6rem">${score}</b>`;
            startBtn.innerText = "TRY AGAIN";
            uiOverlay.classList.remove('hidden');
        }
    </script>
</body>
</html>
